name: 申请友链
description: 提交站点资料，等待维护者审核
title: '[友链申请] '
labels:
  - friend-link
body:
  - type: input
    id: name
    attributes:
      label: 站点名称
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: 站点地址
    validations:
      required: true

  - type: textarea
    id: bio
    attributes:
      label: 站点简介

  - type: input
    id: avatar
    attributes:
      label: 头像地址

  - type: input
    id: backgroundImage
    attributes:
      label: 背景图地址

  - type: input
    id: rss
    attributes:
      label: RSS 或 Atom 地址